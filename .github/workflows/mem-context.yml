name: mem-context

# Fork-specific gate: keeps the memory-context projection and its retrieval
# tool green, and reports the measured token/byte savings on every run.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mem-context-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mem-context:
    name: memory-context tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run memory-context tests
        working-directory: packages/core
        timeout-minutes: 10
        run: bun test test/memory-context.test.ts test/memory-context-savings.test.ts test/cache-mark.test.ts test/tool-get-call-details.test.ts test/tool-find-tool-calls.test.ts test/tool-find-pii.test.ts test/tool-get-tool-call-overview.test.ts test/pii.test.ts test/mem-record.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/mem-context-test.log"

      - name: Report savings
        if: always()
        run: |
          {
            echo "## Memory context savings"
            echo '```'
            grep -E "mem-context-savings|pass|fail" "$GITHUB_WORKSPACE/mem-context-test.log" | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck core
        working-directory: packages/core
        timeout-minutes: 15
        run: bun run typecheck

  core-suite:
    # Fork regression gate: the targeted job above only covers memory-context
    # files, so a change like registering a new builtin can break other core
    # tests unnoticed (see ISSUES.md CI-1). Run the full core suite instead.
    name: core full suite
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run full core suite
        working-directory: packages/core
        timeout-minutes: 25
        run: bun test 2>&1 | tee "$GITHUB_WORKSPACE/core-suite.log"

      - name: Report core suite failures
        if: failure()
        run: |
          {
            echo "## Core suite failures"
            echo '```'
            grep -E "\(fail\)" "$GITHUB_WORKSPACE/core-suite.log" | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run V1 memory retrieval tests
        # The V1 find/details/overview tools and redaction live in packages/opencode
        # and are not part of the core suite above.
        working-directory: packages/opencode
        timeout-minutes: 10
        run: bun test test/tool/memory-retrieval-v1.test.ts test/tool/operational-memory-v1.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/v1-retrieval-test.log"

      - name: Typecheck opencode
        working-directory: packages/opencode
        timeout-minutes: 15
        run: bun run typecheck

  ripgrep-windows:
    name: ripgrep Windows tests
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run Ripgrep tests
        working-directory: packages/core
        timeout-minutes: 8
        run: bun test test/ripgrep.test.ts test/filesystem/search.test.ts

      - name: Probe location layer cleanup
        working-directory: packages/core
        timeout-minutes: 4
        run: bun test test/effect/layer-node/node-build.test.ts
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

      - name: Locate post-suite open handle by file half
        working-directory: packages/core
        timeout-minutes: 10
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          files = sorted(str(path) for path in Path("test").rglob("*.test.ts"))
          midpoint = len(files) // 2
          failed = False
          for label, group in (("first", files[:midpoint]), ("second", files[midpoint:])):
              print(f"{label} half: {len(group)} files", flush=True)
              try:
                  result = subprocess.run(
                      ["bun", "test", "--only-failures", *group],
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, timeout=240,
                  )
                  output = result.stdout
                  print(f"{label} half: exit={result.returncode}", flush=True)
                  failed |= result.returncode != 0
              except subprocess.TimeoutExpired as error:
                  output = error.stdout or b""
                  if isinstance(output, bytes): output = output.decode(errors="replace")
                  print(f"{label} half: timed out after 240s", flush=True)
                  failed = True
              for line in output.splitlines():
                  if " pass" in line or " fail" in line or "Ran " in line or "ReferenceError:" in line:
                      print(line[:300], flush=True)
          raise SystemExit(1 if failed else 0)
          PY
