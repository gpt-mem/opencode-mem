name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on the release branches so cancelled checks do not pollute the
  # branch commit history. PRs and other branches still share a group and cancel
  # stale runs.
  group: ${{ case(contains(fromJSON('["refs/heads/main"]'), github.ref), format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  affected:
    name: affected packages
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.packages.outputs.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests diff against the merge's first parent; pushes diff against the previous head.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Find affected packages
        id: packages
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Storybook hosts the component tests, but no app package depends on it.
          bun x turbo@2.10.2 ls --affected --filter=@opencode/app --filter=@opencode/storybook --output=json > affected.json
          bun -e 'const result = await Bun.file("affected.json").json(); console.log(`app=${result.packages.count > 0}`)' >> "$GITHUB_OUTPUT"

  # A package suite is one bun process that runs its files in order, so a single runner waits out the
  # slowest package (core is ~2x the next one on Windows). Every shard runs its share of each package's
  # files (`bun test --shard`) and the shards together cover the suite exactly once, so the unit wall
  # time becomes the slowest package divided by the shard count instead of its whole runtime.
  # Branch rules pin the check names `unit (linux)` and `unit (windows)`, so the shards report under
  # their own names and the `unit-*-result` jobs below keep the pinned ones.
  unit-linux:
    name: unit (linux, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests diff against the merge's first parent; pushes diff against the previous head.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The search tools shell out to ripgrep. GitHub-hosted images do not ship it, and the
      # runtime fallback that downloads it from GitHub releases fails on the runner network,
      # so install it up front for every platform the unit suite runs on.
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          # The runners have four vCPUs, and each Bun test process performs its own concurrent work.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GITHUB_ACTIONS=false bun turbo test --concurrency=3 -- --shard=${{ matrix.shard }}/4
            exit 0
          fi
          GITHUB_ACTIONS=false bun turbo test --affected --concurrency=3 -- --shard=${{ matrix.shard }}/4
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

  unit-windows:
    name: unit (windows, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    # Windows legs are flaky on GitHub-hosted runners (see issue #126); they must not block a PR.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests diff against the merge's first parent; pushes diff against the previous head.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install ripgrep
        run: choco install ripgrep --yes --no-progress

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GITHUB_ACTIONS=false bun turbo test --concurrency=3 -- --shard=${{ matrix.shard }}/4
            exit 0
          fi
          GITHUB_ACTIONS=false bun turbo test --affected --concurrency=3 -- --shard=${{ matrix.shard }}/4
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

  # Everything that used to run once at the tail of `unit (linux)`: it is independent of the unit tests,
  # so it runs on its own runner beside the shards instead of adding its runtime to theirs.
  verify:
    name: verify (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Test Effect simplification rules
        run: bun run test:effect-simplification-rules

      - name: Check Effect simplifications
        run: bun run lint:effect-simplifications

      - name: Verify published codemode package
        working-directory: packages/codemode
        run: bun run script/publish.ts --dry-run

      - name: Verify packed workerd SDK
        timeout-minutes: 15
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun turbo verify:package --filter=@opencode/sdk
            exit 0
          fi
          bun turbo verify:package --affected --filter=@opencode/sdk
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Check generated documentation
        working-directory: services/www
        run: bun run check:generated

  # Branch rules pin the check names `unit (linux)` and `unit (windows)`; these keep those names and pass
  # only when every shard (and, for Linux, the verification job) passed.
  unit-linux-result:
    name: unit (linux)
    needs: [unit-linux, verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check unit shard and verification results
        env:
          SHARDS: ${{ needs.unit-linux.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          echo "unit shards: $SHARDS, package verification: $VERIFY"
          test "$SHARDS" = success && test "$VERIFY" = success

  unit-windows-result:
    name: unit (windows)
    needs: [unit-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Windows legs are flaky on GitHub-hosted runners (see issue #126); they must not block a PR.
    continue-on-error: true
    steps:
      - name: Check unit shard results
        env:
          SHARDS: ${{ needs.unit-windows.result }}
        run: |
          echo "unit shards: $SHARDS"
          test "$SHARDS" = success

  # The Linux build leg used to bundle the CLI for Bun, build every workspace library and bundle the
  # CLI for Node one after another on a single runner, which made it the longest leg in the workflow.
  # The Bun bundle removes the whole `dist` directory before it writes, so the Bun and the Node
  # bundle cannot share a workspace. Separate runners give each of them their own checkout and let
  # them run at the same time.
  build-linux-service:
    name: build (linux, service)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests diff against the merge's first parent; pushes diff against the previous head.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify compiled service lifecycle
        timeout-minutes: 10
        working-directory: packages/cli
        run: |
          bun run script/build.ts --single --skip-install
          bun run script/service-smoke.ts

      # The app talks to the compiled server, which serves the app build it embeds from its own origin. The
      # suite therefore proves the product against the real protocol, not against the mock the other e2e legs
      # use, and it runs here because this leg already produced the binary it needs.
      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache/0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run the app against the real server
        timeout-minutes: 15
        working-directory: packages/app
        run: bun run test:e2e:real
        env:
          CI: true

      - name: Upload the real backend artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-real-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: packages/app/e2e/test-results/real

      # Unit tests import workspace sources and never build the libraries they use, so this checks those builds. The
      # CLI and app closures hold every library a tested package depends on. The builds are tsc and Bun.build with no
      # platform-specific steps, and the libraries publish from Linux, so Windows skips them.
      - name: Build workspace libraries
        timeout-minutes: 10
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun turbo build --concurrency=3 --filter='@opencode/cli^...' --filter='@opencode/app^...'
            exit 0
          fi
          bun turbo build --affected --concurrency=3 --filter='@opencode/cli^...' --filter='@opencode/app^...'
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

  build-linux-node:
    name: build (linux, node)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests diff against the merge's first parent; pushes diff against the previous head.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Node build runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Verify Node build
        timeout-minutes: 15
        working-directory: packages/cli
        run: |
          bun run script/build-node.ts --single --skip-install --outdir=dist/node
          bun run script/service-smoke.ts --node

  # Branch rules pin the check name `build (linux)`; this keeps that name and passes only when both
  # halves of the Linux build passed.
  build-linux-result:
    name: build (linux)
    needs: [build-linux-service, build-linux-node]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        env:
          SERVICE: ${{ needs.build-linux-service.result }}
          NODE: ${{ needs.build-linux-node.result }}
        run: |
          echo "service build: $SERVICE, node build: $NODE"
          test "$SERVICE" = success && test "$NODE" = success

  # The Windows build leg stays on one runner: it is not the critical path of the workflow, so
  # splitting it would only spend runner minutes without making the workflow finish sooner.
  build-windows:
    name: build (windows)
    runs-on: windows-latest
    # Windows legs are flaky on GitHub-hosted runners (see issue #126); they must not block a PR.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests diff against the merge's first parent; pushes diff against the previous head.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify compiled service lifecycle
        timeout-minutes: 10
        working-directory: packages/cli
        env:
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          bun run script/build.ts --single --skip-install
          bun run script/service-smoke.ts

      - name: Setup Node build runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Verify Node build
        timeout-minutes: 15
        working-directory: packages/cli
        env:
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          bun run script/build-node.ts --single --skip-install --outdir=dist/node
          bun run script/service-smoke.ts --node

  e2e-suite:
    name: e2e (${{ matrix.settings.name }}, ${{ matrix.suite.id }})
    needs: affected
    if: needs.affected.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
        # Playwright splits whole spec files across shards by test count, not duration. Every app-N
        # entry must use the same total, and the entries must cover 1..total. The service worker suite
        # reuses shard 2's production build. Each component suite runs once per OS in its own leg, so the
        # two suites' Storybook servers and test time are not added up on one runner.
        suite:
          - id: app-1
            shard: 1/2
          - id: app-2
            shard: 2/2
          - id: session-ui-components
          - id: app-components
    runs-on: ${{ matrix.settings.host }}
    # Windows legs are flaky on GitHub-hosted runners (see issue #126); they must not block a PR.
    continue-on-error: ${{ matrix.settings.name == 'windows' }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          # Keep the pin inside the composite action so its Node setup cannot overwrite it.
          node-version: "24.15"

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Enable Windows crash diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CI_TEST_STARTED=$((Get-Date).ToUniversalTime().ToString('o'))" >> $env:GITHUB_ENV
          $directory = Join-Path $env:RUNNER_TEMP 'windows-crashes'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          foreach ($executable in @('node.exe', 'bun.exe')) {
            $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$executable"
            New-Item -Force -Path $key | Out-Null
            New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $directory -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 3 -Force | Out-Null
          }
          node --version
          bun --version

      - name: Run app e2e tests against production build
        if: matrix.suite.shard
        run: bun --cwd packages/app test:e2e:built --shard=${{ matrix.suite.shard }}
        env:
          CI: true
        timeout-minutes: 15

      - name: Verify service worker precaching and upgrades
        if: matrix.suite.shard == '2/2'
        working-directory: packages/app
        run: bunx playwright test --config e2e/service-worker/playwright.config.ts
        timeout-minutes: 5

      - name: Run session UI component tests
        if: matrix.suite.id == 'session-ui-components'
        run: bun --cwd packages/session-ui test:components
        env:
          CI: true
        timeout-minutes: 15

      - name: Run app component tests
        if: matrix.suite.id == 'app-components'
        run: bun --cwd packages/app test:components
        env:
          CI: true
        timeout-minutes: 15

      - name: Collect Windows crash events
        if: always() && runner.os == 'Windows' && env.CI_TEST_STARTED != ''
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'windows-crashes'
          # Event 1000 identifies the faulting executable and native module; 1001 adds the WER bucket.
          Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            Id = 1000, 1001
            StartTime = [datetime]$env:CI_TEST_STARTED
          } -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Id, ProviderName, Message |
            Out-String -Width 4096 |
            Tee-Object -FilePath (Join-Path $directory 'events.txt')

      - name: Upload Windows crash diagnostics
        if: always() && runner.os == 'Windows' && env.CI_TEST_STARTED != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-crashes-${{ matrix.suite.id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-crashes
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ matrix.suite.id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
            packages/session-ui/component-tests/test-results
            packages/session-ui/component-tests/playwright-report
            packages/app/component-tests/test-results
            packages/app/component-tests/playwright-report

  # Branch rules require one e2e check per OS. These keep those names and pass only when every
  # leg above passed, or when no leg was needed; a failing leg on either OS fails both checks.
  e2e:
    name: e2e (${{ matrix.os }})
    needs: [affected, e2e-suite]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check browser test results
        env:
          AFFECTED: ${{ needs.affected.result }}
          SUITES: ${{ needs.e2e-suite.result }}
          EXPECTED: ${{ needs.affected.outputs.e2e == 'true' && 'success' || 'skipped' }}
        run: |
          echo "affected packages: $AFFECTED, browser test legs: $SUITES (expected $EXPECTED)"
          test "$AFFECTED" = success && test "$SUITES" = "$EXPECTED"
