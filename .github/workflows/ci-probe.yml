name: ci-probe
on: push
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            windows:
              - '**/*.ps1'
  unit:
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
