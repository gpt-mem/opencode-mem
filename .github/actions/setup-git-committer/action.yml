name: "Setup Git Committer"
description: "Create app token and configure git user"
inputs:
  opencode-app-id:
    description: "OpenCode GitHub App ID. Optional: the workflow token is used when it is missing."
    required: false
  opencode-app-secret:
    description: "OpenCode GitHub App private key. Optional: the workflow token is used when it is missing."
    required: false
outputs:
  token:
    description: "GitHub App token, or the workflow token when no app is configured"
    value: ${{ steps.apptoken.outputs.token || steps.workflow-token.outputs.token }}
  app-slug:
    description: "GitHub App slug"
    value: ${{ steps.apptoken.outputs.app-slug }}
runs:
  using: "composite"
  steps:
    - name: Create app token
      id: apptoken
      if: inputs.opencode-app-id != '' && inputs.opencode-app-secret != ''
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.opencode-app-id }}
        private-key: ${{ inputs.opencode-app-secret }}
        owner: ${{ github.repository_owner }}

    # A fork has no GitHub App. The workflow token keeps the job running instead
    # of failing on a credential the fork cannot own.
    - name: Use the workflow token
      id: workflow-token
      if: steps.apptoken.outputs.token == ''
      run: echo "token=${GITHUB_TOKEN}" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Configure git user
      run: |
        if [ -n "${{ steps.apptoken.outputs.app-slug }}" ]; then
          slug="${{ steps.apptoken.outputs.app-slug }}"
          git config --global user.name "${slug}[bot]"
          git config --global user.email "${slug}[bot]@users.noreply.github.com"
        else
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        fi
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git remote
      run: |
        git remote set-url origin https://x-access-token:${{ steps.apptoken.outputs.token || steps.workflow-token.outputs.token }}@github.com/${{ github.repository }}
      shell: bash
